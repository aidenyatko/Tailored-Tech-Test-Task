services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "${COMPOSE_FRONTEND_PORT:-8080}:8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://dataroom:dataroom@postgres:5432/dataroom?schema=public}
      PORT: ${BACKEND_PORT:-8080}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    expose:
      - "8080"
    volumes:
      - upload-data:/app/uploads

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataroom}
      POSTGRES_USER: ${POSTGRES_USER:-dataroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataroom}
    ports:
      - "${COMPOSE_POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  upload-data:
